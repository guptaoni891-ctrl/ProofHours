[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./docs" }]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
# only the remappings above: auto-detection would add whatever nested submodules happen to be checked out, changing the metadata hash
auto_detect_remappings = false

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false
